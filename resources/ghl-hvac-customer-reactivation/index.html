<style>
  :root{--green-900:#1b4332;--green-700:#2D6A4F;--green-500:#47946F;--green-100:#DBE5DD;--mint:#F1F4F1;--ink:#1f2a25;--ink-soft:#414e47;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--mint);min-height:100vh;display:grid;place-items:center;padding:1.5rem}
  .box{background:#fff;border:1px solid var(--green-100);border-radius:16px;max-width:26rem;width:100%;padding:2.4rem 2rem;text-align:center;box-shadow:0 18px 48px rgba(27,67,50,.10)}
  .logo{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--green-900);font-size:1.1rem;margin-bottom:1.4rem}
  .logo img{width:30px;height:30px}
  h1{font-size:1.3rem;color:var(--green-900);line-height:1.3;margin-bottom:.5rem}
  p.sub{color:var(--ink-soft);font-size:.95rem;line-height:1.5;margin-bottom:1.5rem}
  form{display:flex;flex-direction:column;gap:.7rem}
  input{font-size:1rem;padding:.75rem .9rem;border:1.5px solid var(--green-100);border-radius:10px;outline:none;width:100%}
  input:focus{border-color:var(--green-500)}
  button{font-size:1rem;font-weight:700;color:#fff;background:var(--green-700);border:none;border-radius:10px;padding:.8rem;cursor:pointer;transition:background .15s}
  button:hover{background:var(--green-900)}
  .err{color:#A85C4B;font-size:.88rem;min-height:1.1rem;font-weight:600}
  .foot{margin-top:1.5rem;font-size:.82rem;color:var(--ink-soft)}
  .foot a{color:var(--green-700);text-decoration:none;font-weight:600}
</style>
</head>

    var KEY = 'fl_cs_pw';
    function b2u(b){var bin=atob(b);var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
    async function deriveKey(pw){
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    }
    async function tryDecrypt(pw){
      var key=await deriveKey(pw);
      var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(ENC.iv)},key,b2u(ENC.data));
      return new TextDecoder().decode(buf);
    }
    function render(html){document.open();document.write(html);document.close();}
    var form=document.getElementById('f'),err=document.getElementById('err'),pwEl=document.getElementById('pw');
    form.addEventListener('submit',async function(e){
      e.preventDefault();err.textContent='';
      try{var html=await tryDecrypt(pwEl.value);sessionStorage.setItem(KEY,pwEl.value);render(html);}
      catch(_){err.textContent='Wrong password — try again.';pwEl.select();}
    });
    (async function(){
      var saved=sessionStorage.getItem(KEY);
      if(!saved)return;
      try{var html=await tryDecrypt(saved);render(html);}catch(_){sessionStorage.removeItem(KEY);}
    })();
